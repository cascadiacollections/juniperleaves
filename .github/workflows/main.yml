name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push supersedes a PR build, but a run on main is never cancelled:
# that would kill a Pages publish part-way through.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run check

      - name: Verify deployable artifacts
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/site.webmanifest
          test -f dist/icon.svg
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          test -f dist/icon-maskable-512.png
          test -f dist/apple-touch-icon.png
          test -f dist/og-image.png
          grep -q '^juniperleaves.com$' dist/CNAME
          grep -q 'https://juniperleaves.com/' dist/sitemap.xml
          grep -q 'static.cloudflareinsights.com/beacon.min.js' dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html
          grep -q 'class="product-card"' dist/index.html
          ! grep -qE '<!-- (csp|listings:[a-z]+) -->|%[A-Z_]+%' dist/index.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
