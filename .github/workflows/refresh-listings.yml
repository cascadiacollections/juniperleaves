name: Refresh listings

# Keeps the featured Etsy listings honest. Once a week, scripts/refresh-listings.ts
# re-reads each featured listing from the Etsy Open API: prices and photos are
# updated, and a listing that is no longer active is swapped for the shop's
# most recently updated one. Any change arrives as a PR to review, never as a
# direct push to main.
#
# Needs the ETSY_API_KEY repository secret ("keystring:shared_secret" from
# https://www.etsy.com/developers/your-apps). Without it the job skips.

on:
  schedule:
    # Mondays 15:00 UTC (08:00 Pacific), an hour before the link check.
    - cron: '0 15 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: automation/refresh-listings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check for the Etsy API key
        id: key
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          if [ -z "$ETSY_API_KEY" ]; then
            echo "::notice::ETSY_API_KEY is not set; skipping the listing refresh."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: npm ci

      - name: Refresh from Etsy
        id: refresh
        if: steps.key.outputs.present == 'true'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          CHANGES_FILE: ${{ runner.temp }}/changes.md
        run: |
          npm run refresh-listings
          if git diff --quiet src/listings.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$CHANGES_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so the
      # same check CI runs happens here before anything is pushed.
      - name: Check and build
        if: steps.refresh.outputs.changed == 'true'
        run: npm run check

      - name: Open or update the refresh PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGES_FILE: ${{ runner.temp }}/changes.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "chore(listings): refresh featured Etsy listings"
          git push --force origin "$BRANCH"

          {
            echo "Weekly refresh of the featured listings from the Etsy API."
            echo
            cat "$CHANGES_FILE"
            echo
            echo "Check the photos and titles read well, then merge to publish."
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --base main \
              --title "chore(listings): refresh featured Etsy listings" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
